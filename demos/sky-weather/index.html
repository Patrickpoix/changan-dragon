<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>龙游长安 - 程序化天空与天气系统 Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #app { width: 100vw; height: 100vh; }
    #ui {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(15, 20, 35, 0.82); backdrop-filter: blur(8px);
      color: #e8e0d0; padding: 14px 16px; border-radius: 10px;
      border: 1px solid rgba(255,200,120,0.25); min-width: 260px;
      font-size: 13px; line-height: 1.6;
    }
    #ui h3 { color: #ffd27a; font-size: 14px; margin-bottom: 8px; }
    #stats { position: fixed; bottom: 12px; left: 12px; z-index: 10; background: rgba(15,20,35,0.7); color: #9fe8a0; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"><h3>龙游长安 · 天空天气控制台</h3></div>
  <div id="stats">FPS: -- | DrawCall: --</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
