<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>龙游长安 - NPC 群集原型</title>
  <style>
    html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:monospace;}
    #hud{position:fixed;top:10px;left:10px;color:#0f0;background:rgba(0,0,0,.6);padding:10px;
         font-size:12px;line-height:1.6;z-index:10;white-space:pre;}
    #controls{position:fixed;top:10px;right:10px;color:#fff;background:rgba(0,0,0,.6);padding:10px;z-index:10;font-size:12px;}
  </style>
</head>
<body>
  <div id="hud">loading...</div>
  <div id="controls">
    时间: <input type="range" id="time" min="0" max="24" step="0.1" value="12">
    <span id="timeLabel">12:00</span><br>
    NPC: <span id="npcCount">?</span><br>
    <button id="flood">上元灯节 1000</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
