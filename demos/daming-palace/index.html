<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>龙游长安 · 大明宫精模 3D</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #app { width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 10;
      color: #f5e9c8; background: rgba(20,16,8,0.62); border: 1px solid rgba(210,180,120,0.5);
      padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.7;
      pointer-events: none; backdrop-filter: blur(4px);
    }
    #hud b { color: #ffd98a; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <b>大明宫 · 龙首原</b><br/>
    点击画面锁定鼠标 | <b>WASD</b> 移动 | 鼠标 视角<br/>
    <b>F</b> 飞行模式 | <b>1-5</b> 地标 | <b>T</b> 昼夜
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
