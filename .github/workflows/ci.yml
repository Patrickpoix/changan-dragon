name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JS syntax
        run: |
          echo "Checking JS syntax..."
          for f in src/enhance/*.js src/*.js; do
            if [ -f "$f" ]; then
              node --check "$f" && echo "✓ $f"
            fi
          done

      - name: Verify boot.js manifest files exist
        run: |
          echo "Verifying boot.js load manifest..."
          missing=0
          while IFS= read -r path; do
            if [ ! -f "$path" ]; then
              echo "::error::MISSING (referenced in boot.js but not on disk): $path"
              missing=1
            else
              echo "✓ $path"
            fi
          done < <(grep -oE "'[^']+\.js'" src/boot.js | sed "s/'//g")
          if [ "$missing" = "1" ]; then
            echo "::error::boot.js references files that do not exist"
            exit 1
          fi

      - name: Check for orphaned enhance files
        run: |
          echo "Checking enhance directory vs dynamic loader..."
          for f in src/enhance/*.js; do
            base=$(basename "$f")
            # enhance modules are dynamically loaded by 30-main.js, not boot.js
            # Check that 30-main.js references each enhance module
            if ! grep -q "enhance/$base" src/30-main.js; then
              echo "::warning::ORPHAN enhance file (not referenced in 30-main.js): src/enhance/$base"
            fi
          done

      - name: Verify index.html completeness
        run: |
          echo "Checking index.html ends with </html>..."
          if ! tail -c 20 index.html | grep -q '</html>'; then
            echo "::error::index.html does NOT end with </html> - possible truncation!"
            echo "Last 20 bytes:"
            tail -c 20 index.html | cat -v
            exit 1
          fi
          echo "✓ index.html ends with </html>"
          # Also check minimum size (should be > 40KB for the full UI)
          SIZE=$(wc -c < index.html)
          if [ "$SIZE" -lt 40000 ]; then
            echo "::error::index.html too small ($SIZE bytes) - expected > 40000"
            exit 1
          fi
          echo "✓ index.html size: $SIZE bytes"

      - name: Block new numbered modules (anti-bloat)
        run: |
          echo "Checking for new numbered modules beyond core system..."
          # Existing core modules go up to 30-main.js. Block any new NNN-*.js in src/
          # where NNN > 30 (e.g. 31-*.js, 141-*.js, 200-*.js)
          NEW_MODULES=$(ls src/[0-9]*.js 2>/dev/null | grep -vE 'src/(0[0-9]|1[0-9]|2[0-9]|30)-' || true)
          if [ -n "$NEW_MODULES" ]; then
            echo "::error::New numbered modules detected (should use enhance/ instead):"
            echo "$NEW_MODULES"
            echo "::error::Per agent.md section 2, add features to existing enhance/*.js owners, not new numbered files"
            exit 1
          fi
          echo "✓ No new numbered modules"

      - name: Check for banned variable names
        run: |
          echo "Checking for incorrect global variable names..."
          # These old names were used in deleted 121-140 modules and must not reappear
          if grep -rn 'sunLight' src/ --include='*.js' | grep -v '//'; then
            echo "::error::Found sunLight (should be sun)"
            exit 1
          fi
          if grep -rn 'ambientLight' src/ --include='*.js' | grep -v '//'; then
            echo "::error::Found ambientLight (should be ambient)"
            exit 1
          fi
          echo "✓ No banned variable names"

      - name: Summary
        run: |
          echo "=== CI Validation Complete ==="
          echo "All checks passed"
